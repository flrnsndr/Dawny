<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dawny store screenshot</title>
<!--
  One captioned App Store screenshot (1320 × 2868) per render.
  Rendered by scripts/render-store-screenshots.sh as template.html?lang=de&slide=reset.
  Look and palette follow the website (website/src/styles/global.css), the
  horizon line comes from the app icon. Texts live in captions.js, the phone
  contents are the raw captures in screenshots/<lang>/.
-->
<style>
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Instrument Serif"; src: url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2"); font-style: normal; }
@font-face { font-family: "Instrument Serif"; src: url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); font-style: italic; }

:root {
  --paper-warm: #fdf5ea;
  --ink: #17140f;
  --ink-2: #4b443a;
  --accent: #c0521a;
  --horizon: #3d4178;
  --night-ink: #f3eee5;
  --night-muted: #a9a296;
  --night-accent: #f5b070;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1320px; height: 2868px; overflow: hidden; background: var(--paper-warm); }
body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }

.slide { position: relative; width: 1320px; height: 2868px; overflow: hidden; display: none; }
.slide.on { display: block; }
.day { background:
  radial-gradient(120% 55% at 50% 108%, rgba(247,176,74,.34) 0%, rgba(247,176,74,0) 70%),
  var(--paper-warm); }

/* Caption block */
.cap { position: absolute; left: 110px; right: 110px; top: 210px; }
.kicker { font: 650 36px/1 "Inter"; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.horizon { width: 96px; height: 7px; border-radius: 4px; background: var(--horizon); margin: 34px 0 40px; }
h1 { font: 400 128px/1.02 "Instrument Serif"; letter-spacing: -.012em; color: var(--ink); text-wrap: balance; }
h1 em { font-style: italic; color: var(--accent); }
.sub { margin-top: 38px; font: 450 46px/1.32 "Inter"; color: var(--ink-2); text-wrap: pretty; max-width: 1060px; }

/* Phone. --w is the outer width, --s scales the 1320 px capture to the screen
   width (--w minus the bezel, 95.2 % of --w). */
.phone { position: absolute; background: #0e0e10; border-radius: calc(var(--w) * .135); padding: calc(var(--w) * .024);
  width: var(--w); box-shadow: 0 50px 90px -30px rgba(60,40,20,.35), 0 0 0 2px #2a2a2e inset; }
.screen { position: relative; width: 100%; aspect-ratio: 1320 / 2868; border-radius: calc(var(--w) * .112); overflow: hidden; background: #fff; }
.screen > .px { position: absolute; left: 0; top: 0; width: 1320px; height: 2868px; transform-origin: 0 0; transform: scale(var(--s)); }
.screen img { display: block; width: 1320px; height: 2868px; }
/* XCUITest captures leave the Dynamic Island out, simctl captures (widgets) keep it. */
.island { position: absolute; left: 50%; top: 42px; width: 372px; height: 108px; margin-left: -186px; border-radius: 54px; background: #000; }

.note { position: absolute; font: italic 400 64px/1.05 "Instrument Serif"; color: var(--accent); }
.arrow { position: absolute; left: 0; top: 0; overflow: visible; }

/* 1 · Reset: night into dawn */
.night { background: linear-gradient(180deg, #14151a 0%, #1a1c2b 34%, #2e3160 58%, #8a5a62 76%, #e79a52 90%, #f7c27a 100%); }
.night .kicker { color: #f0a868; }
.night .horizon { background: #f0a868; }
.night h1 { color: var(--night-ink); }
.night h1 em { color: var(--night-accent); }
.night .sub { color: var(--night-muted); }
.label { position: absolute; font: 600 44px/1 "Inter"; color: var(--night-ink); }
.pill { position: absolute; transform: translate(-50%, -50%); background: var(--night-ink); color: #14151a;
  font: 700 46px/1 "Inter"; padding: 22px 34px; border-radius: 60px; display: flex; gap: 14px; align-items: center;
  white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.35); }

/* 6 · Free */
.dark { background:
  radial-gradient(80% 30% at 50% 104%, rgba(247,176,74,.55) 0%, rgba(247,176,74,0) 70%),
  linear-gradient(180deg, #14151a 0%, #1b1d2a 70%, #2b2d4d 100%); }
.dark h1 { color: var(--night-ink); font-size: 150px; }
.dark h1 em { color: var(--night-accent); }
.dark .sub { color: var(--night-muted); }
.appicon { width: 240px; height: 240px; border-radius: 54px; box-shadow: 0 20px 60px rgba(247,176,74,.25); margin-bottom: 90px; display: block; }
.feat { position: absolute; left: 110px; right: 110px; top: 1180px; display: grid; gap: 96px; }
.feat li { list-style: none; display: grid; grid-template-columns: 124px 1fr; column-gap: 44px; align-items: center; }
.feat .ico { width: 124px; height: 124px; border-radius: 34px; background: rgba(243,238,229,.08); border: 2px solid rgba(243,238,229,.12);
  display: grid; place-items: center; }
.feat svg { width: 64px; height: 64px; stroke: var(--night-accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.feat b { display: block; font: 600 58px/1.15 "Inter"; color: var(--night-ink); }
.feat span { display: block; margin-top: 8px; font: 400 44px/1.3 "Inter"; color: var(--night-muted); }
.sun { position: absolute; left: 50%; bottom: 158px; width: 240px; height: 120px; margin-left: -120px; border-radius: 120px 120px 0 0;
  background: linear-gradient(#ffd37a, #f6a64a); box-shadow: 0 0 120px 40px rgba(247,176,74,.35); }
.sunline { position: absolute; left: 50%; bottom: 150px; width: 640px; margin-left: -320px; height: 8px; border-radius: 4px; background: #6a70b8; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="ah-light" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#f3eee5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ah-accent" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#c0521a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
</svg>

<section class="slide night" id="reset">
  <div class="cap"><div class="kicker" data-t="kicker"></div><div class="horizon"></div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
  <svg class="arrow" width="1320" height="2868">
    <path d="M 330 1150 C 420 920, 900 920, 990 1130" fill="none" stroke="#f3eee5" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22" marker-end="url(#ah-light)"/>
  </svg>
  <div class="pill" style="left:660px;top:970px">
    <svg width="40" height="40" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#14151a"/></svg><span data-t="time"></span>
  </div>
  <div class="label" style="left:70px;top:1210px" data-t="evening"></div>
  <div class="label" style="left:700px;top:1210px" data-t="morning"></div>
  <div class="phone" style="--w:570px;--s:calc(542.6/1320);left:60px;top:1290px">
    <div class="screen"><div class="px"><img data-shot="02_Today"><div class="island"></div></div></div>
  </div>
  <div class="phone" style="--w:570px;--s:calc(542.6/1320);left:690px;top:1290px">
    <div class="screen"><div class="px"><img data-shot="05_TodayMorning"><div class="island"></div></div></div>
  </div>
</section>

<section class="slide day" id="backlog">
  <div class="cap"><div class="kicker" data-t="kicker"></div><div class="horizon"></div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
  <svg class="arrow" width="1320" height="2868">
    <line x1="150" y1="1090" x2="150" y2="2560" stroke="#c0521a" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22" marker-end="url(#ah-accent)"/>
  </svg>
  <div class="note" style="left:100px;top:980px" data-t="soon"></div>
  <div class="note" style="left:40px;top:2620px;font-size:58px;transform:rotate(-4deg)" data-t="someday"></div>
  <div class="phone" style="--w:940px;--s:calc(894.9/1320);left:330px;top:920px">
    <div class="screen"><div class="px"><img data-shot="01_Backlog"><div class="island"></div></div></div>
  </div>
</section>

<section class="slide day" id="today">
  <div class="cap"><div class="kicker" data-t="kicker"></div><div class="horizon"></div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
  <div class="phone" style="--w:1040px;--s:calc(990/1320);left:140px;top:920px">
    <div class="screen"><div class="px"><img data-shot="02_Today"><div class="island"></div></div></div>
  </div>
</section>

<section class="slide day" id="archive">
  <div class="cap"><div class="kicker" data-t="kicker"></div><div class="horizon"></div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
  <div class="phone" style="--w:960px;--s:calc(913.9/1320);left:410px;top:920px">
    <div class="screen"><div class="px"><img data-shot="03_Archive"><div class="island"></div></div></div>
  </div>
  <div class="note" style="left:60px;top:1530px;font-size:60px;line-height:1.08;white-space:nowrap;transform:rotate(-4deg)" data-t="note"></div>
  <svg class="arrow" width="1320" height="2868">
    <path d="M 150 1500 C 150 1410, 270 1375, 430 1380" fill="none" stroke="#c0521a" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22" marker-end="url(#ah-accent)"/>
  </svg>
</section>

<section class="slide day" id="widgets">
  <div class="cap"><div class="kicker" data-t="kicker"></div><div class="horizon"></div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
  <div class="phone" style="--w:1040px;--s:calc(990/1320);left:140px;top:920px">
    <div class="screen"><div class="px"><img data-shot="04_Widgets"></div></div>
  </div>
</section>

<section class="slide dark" id="free">
  <div class="cap">
    <img class="appicon" src="../../App/Assets.xcassets/AppIcon.appiconset/Dawny%20Icon%20Gemini%201024x1024%20300dpi.png">
    <h1 data-t="title"></h1><p class="sub" data-t="sub"></p>
  </div>
  <ul class="feat"></ul>
  <div class="sun"></div><div class="sunline"></div>
</section>

<script src="captions.js"></script>
<script>
  const ICONS = {
    cloud: '<path d="M7 18h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.4 9.1 4.5 4.5 0 0 0 7 18z"/>',
    list: '<circle cx="5" cy="7" r="1.4"/><circle cx="5" cy="12" r="1.4"/><circle cx="5" cy="17" r="1.4"/><path d="M9.5 7H20M9.5 12H20M9.5 17H20"/>',
    wave: '<path d="M4 12v0M7.5 9v6M11 5v14M14.5 8v8M18 10.5v3M20.5 12v0"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  };

  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") || "de";
  const slide = document.getElementById(params.get("slide") || "reset");
  const texts = window.CAPTIONS[lang][slide.id];

  document.documentElement.lang = lang;
  slide.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = texts[el.dataset.t]; });
  slide.querySelectorAll("img[data-shot]").forEach(img => {
    img.src = `../../screenshots/${lang}/${img.dataset.shot}.png`;
  });
  if (texts.features) {
    slide.querySelector(".feat").innerHTML = texts.features.map(([icon, title, line]) =>
      `<li><div class="ico"><svg viewBox="0 0 24 24">${ICONS[icon]}</svg></div><div><b>${title}</b><span>${line}</span></div></li>`
    ).join("");
  }
  slide.classList.add("on");
</script>
</body>
</html>
