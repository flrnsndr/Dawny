# The website is currently taken offline: instead of building the Astro site,
# this workflow mirrors `website/offline/` — a single notice page plus its
# .htaccess — onto the webspace. Because the mirror runs with --delete, that
# upload removes every previously published page.
#
# To bring the site back, revert the commit that introduced this state. That
# restores the `npm ci` / `npm run build` steps and the `dist/` mirror.
name: Deploy Website to IONOS

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
        working-directory: .

      - name: Deploy offline notice to IONOS via SFTP
        run: |
          lftp -u "${{ secrets.IONOS_FTP_USER }},${{ secrets.IONOS_FTP_PASSWORD }}" \
            sftp://${{ secrets.IONOS_FTP_HOST }} -e "
            set sftp:auto-confirm yes;
            mirror --reverse --delete --verbose offline/ ${{ secrets.IONOS_FTP_REMOTE_DIR }};
            quit"
